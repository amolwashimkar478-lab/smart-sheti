<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌱 Crop Calendar</title>

<style>
body{
  font-family: Arial;
  background:#e8f5e9;
  padding:20px;
}
.container{
  max-width:420px;
  margin:auto;
}
.card{
  background:#fff;
  padding:16px;
  border-radius:14px;
  margin-bottom:12px;
}
select, button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background:#2e7d32;
  color:white;
  border:none;
}
.alert{
  background:#fff3cd;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>🌱 Crop Calendar (Premium)</h2>

<div class="card">
  <label>पीक निवडा</label>
  <select id="crop">
    <option value="cotton">कापूस</option>
    <option value="soybean">सोयाबीन</option>
    <option value="wheat">गहू</option>
    <option value="rice">भात</option>
  </select>

  <button onclick="showCalendar()">📅 Calendar पाहा</button>
</div>

<div class="card" id="result" style="display:none"></div>

<button onclick="location.href='home.html'">⬅ मुख्य पेज</button>
</div>

<script>
const calendarData = {
  cotton:{
    sowing:"15 जून – 15 जुलै",
    fertilizer:"पेरणीनंतर 25 दिवस",
    spray:"कोरडं हवामान (पाऊस नसेल तेव्हा)"
  },
  soybean:{
    sowing:"20 जून – 10 जुलै",
    fertilizer:"20 दिवसांनी",
    spray:"हलका वारा + पाऊस नाही"
  },
  wheat:{
    sowing:"15 ऑक्टोबर – 15 नोव्हेंबर",
    fertilizer:"30 दिवसांनी",
    spray:"थंड व कोरडं हवामान"
  },
  rice:{
    sowing:"जून – जुलै",
    fertilizer:"पेरणीनंतर 20 दिवस",
    spray:"पाऊस थांबल्यावर"
  }
};

function showCalendar(){
  const crop = document.getElementById("crop").value;
  const data = calendarData[crop];

  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML = `
    <b>🌾 पेरणी वेळ:</b> ${data.sowing}<br><br>
    <b>💧 खत वेळ:</b> ${data.fertilizer}<br><br>
    <b>🚜 फवारणी:</b> ${data.spray}
  `;

  checkWeatherAlert(data.spray);
}
</script>

<script src="weather-alert.js"></script>
</body>
</html>
