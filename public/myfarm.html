<!DOCTYPE html>
<html lang="mr">
<head>
    <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>
<script>
  window.OneSignal = window.OneSignal || [];
  OneSignal.push(function() {
    OneSignal.init({
      appId: "fdb7e40a-dc5c-4620-85d7-d99e5db6eb91",
      safari_web_id: "", // जर असेल तर टाका, अन्यथा रिकामे ठेवा
      notifyButton: {
        enable: true, // उजव्या कोपऱ्यात नोटिफिकेशनची छोटी घंटा दिसेल
      },
      allowLocalhostAsSecureOrigin: true,
    });
    
    // युजरला सबस्क्राईब करण्यासाठी प्रॉम्प्ट दाखवणे
    OneSignal.showNativePrompt();
  });

  // पिकाचा सल्ला पुश करण्यासाठी फंक्शन
  function sendOneSignalNotification(cropName, message) {
    OneSignal.push(function() {
      OneSignal.sendSelfNotification(
        "🌾 शेती सल्ला: " + cropName,
        message,
        null,
        null,
        { "en": message }
      );
    });
  }
</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माझा शेती डॅशबोर्ड</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .home-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    border-radius: 50%;
    font-size: 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    z-index: 1000;
        }
        :root { --primary: #00b894; --dark: #2d3436; --bg: #f4f7f6; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #1e3799, #00b894); color: white; padding: 30px 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .container { padding: 20px; max-width: 500px; margin: auto; }
        .add-card { background: white; border-radius: 15px; padding: 20px; margin-top: -20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; color: #636e72; }
        select, input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        .btn-add { background: var(--dark); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .crop-card { background: white; border-radius: 15px; padding: 15px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 6px solid var(--primary); }
        .crop-info h4 { margin: 0; color: var(--dark); }
        .btn-view { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .delete-btn { color: #ff7675; cursor: pointer; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2>🚜 माझी डिजिटल शेती</h2>
    <p>तुमची पिके जोडा आणि व्यवस्थापन करा</p>
</div>

<a href="home.html" class="home-btn" aria-label="Home वर जा">⬅️</a>

<div class="header">

<div class="container">
    <div class="add-card">
        <div class="input-group">
            <label>हंगाम निवडा</label>
            <select id="seasonSelect" onchange="updateCrops()">
                <option value="">-- निवडा --</option>
                <option value="Kharif">खरीप (पावसाळी)</option>
                <option value="Rabi">रब्बी (हिवाळी)</option>
                <option value="Summer">उन्हाळी</option>
                <option value="Fruit">भाजीपाला/नगदी</option>
            </select>
        </div>
        <div class="input-group">
            <label>पीक निवडा</label>
            <select id="cropSelect"></select>
        </div>
        <div class="input-group">
            <label>लागवड तारीख</label>
            <input type="date" id="pDate">
        </div>
        <button class="btn-add" onclick="addCrop()">डॅशबोर्डवर जोडा</button>
    </div>

    <div id="displayArea" style="margin-top:20px;"></div>
</div>

<script>
    const cropData = {
        "Kharif": ["कापूस", "सोयाबीन", "तूर", "भात", "मका", "मूग", "उडीद", "बाजरी", "ज्वारी", "भुईमूग", "तीळ", "सूर्यफूल"],
        "Rabi": ["गहू", "हरभरा", "कांदा", "लसूण", "बटाटा", "मोहरी", "करडई", "ज्वारी (रब्बी)", "वाटाणा", "मसूर"],
        "Summer": ["कलिंगड", "खरबूज", "काकडी", "भेंडी", "गवार", "भुईमूग (उन्हाळी)", "मूग (उन्हाळी)"],
        "Fruit": ["हळद", "आले", "मिरची", "टोमॅटो", "वांगी", "कोबी", "फ्लॉवर", "शिमला मिरची", "दूधधुंद"]
    };

    function updateCrops() {
        const s = document.getElementById('seasonSelect').value;
        const c = document.getElementById('cropSelect');
        c.innerHTML = '';
        if(cropData[s]) cropData[s].forEach(p => c.add(new Option(p, p)));
    }

    function addCrop() {
        const crop = document.getElementById('cropSelect').value;
        const date = document.getElementById('pDate').value;
        if(!crop || !date) return alert("कृपया सर्व माहिती भरा!");

        let farm = JSON.parse(localStorage.getItem("farmList") || "[]");
        farm.push({ id: Date.now(), crop, date });
        localStorage.setItem("farmList", JSON.stringify(farm));
        render();
    }

    function render() {
        const farm = JSON.parse(localStorage.getItem("farmList") || "[]");
        const area = document.getElementById('displayArea');
        area.innerHTML = farm.length ? "" : "<p style='text-align:center; color:grey;'>अद्याप कोणतेही पीक जोडलेले नाही.</p>";
        farm.forEach(item => {
            area.innerHTML += `
                <div class="crop-card">
                    <div class="crop-info">
                        <h4>🌾 ${item.crop}</h4>
                        <span style="font-size:12px; color:grey;">तारीख: ${item.date}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <button class="btn-view" onclick="location.href='advice.html?crop=${item.crop}&date=${item.date}'">पहा</button>
                        <span class="delete-btn" onclick="remove(${item.id})">🗑️</span>
                    </div>
                </div>`;
        });
    }

    function remove(id) {
        if(confirm("हे पीक काढून टाकायचे का?")) {
            let farm = JSON.parse(localStorage.getItem("farmList") || "[]").filter(i => i.id !== id);
            localStorage.setItem("farmList", JSON.stringify(farm));
            render();
        }
    }
    window.onload = render;
</script>
</body>
</html>
